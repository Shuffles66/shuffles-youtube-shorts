<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shuffles YouTube Shorts theme preview</title>
    <link rel="stylesheet" href="../assets/frontend.css">
    <style>
        :root {
            --ast-global-color-0: #FFD65C;
            --ast-global-color-1: #FF3FCF;
            --ast-global-color-2: #F4EAFF;
            --ast-global-color-3: #EADFF2;
            --ast-global-color-4: #0D0614;
            --ast-global-color-5: #180722;
            --ast-global-color-6: #54106B;
            --ast-global-color-7: #D8B8ED;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: #2e0e20;
            background: #180722;
            font-family: system-ui, sans-serif;
        }

        main {
            width: min(1180px, 100%);
            margin: 0 auto;
            padding: clamp(16px, 4vw, 48px);
            background: #3a064f;
        }

        h1 {
            color: var(--ast-global-color-2);
        }

        .ssys-player {
            display: grid;
            min-height: 280px;
            place-items: center;
            color: #180722;
            background: linear-gradient(145deg, #ff3fcf, #ffd65c);
            font-weight: 800;
        }
    </style>
</head>
<body>
    <main>
        <h1>Watch Our Latest YouTube Shorts</h1>
        <div class="ssys-gallery">
            <div class="ssys-grid" data-cols="3" style="--ssys-cols: 3">
                <article class="ssys-card">
                    <div class="ssys-player">Short 1</div>
                    <h2 class="ssys-title">Byron Bay Sunset Ride — a deliberately long video title</h2>
                </article>
                <article class="ssys-card">
                    <div class="ssys-player">Short 2</div>
                    <h2 class="ssys-title">The best way to explore Byron</h2>
                </article>
                <article class="ssys-card">
                    <div class="ssys-player">Short 3</div>
                    <h2 class="ssys-title">Local tips from Byron Rides</h2>
                </article>
            </div>
        </div>
        <p class="ssys-message" role="status">No public playlist named “Example” was found on that channel.</p>
    </main>
    <script src="../assets/frontend.js"></script>
</body>
</html>
