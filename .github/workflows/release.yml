name: Package release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build WordPress plugin archive
        run: |
          mkdir -p dist/shuffles-youtube-shorts
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist' \
            --exclude 'tests' \
            ./ dist/shuffles-youtube-shorts/
          cd dist
          zip -r shuffles-youtube-shorts.zip shuffles-youtube-shorts

      - name: Attach archive to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/shuffles-youtube-shorts.zip --clobber
