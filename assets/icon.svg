<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Shuffles Youtube Shorts</title>
  <desc id="desc">A vivid vertical video player with a play symbol and colourful shuffle arrows.</desc>
  <defs>
    <linearGradient id="bg" x1="18" y1="10" x2="238" y2="246" gradientUnits="userSpaceOnUse">
      <stop stop-color="#21003f"/>
      <stop offset="0.46" stop-color="#6138ff"/>
      <stop offset="1" stop-color="#ff2f85"/>
    </linearGradient>
    <linearGradient id="play" x1="86" y1="70" x2="174" y2="152" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ff4ff"/>
      <stop offset="1" stop-color="#ffdf57"/>
    </linearGradient>
    <linearGradient id="shuffle" x1="77" y1="166" x2="184" y2="211" gradientUnits="userSpaceOnUse">
